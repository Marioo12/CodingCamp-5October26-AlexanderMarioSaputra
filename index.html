<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Page</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>

    <!-- ── Header: Date, Clock, Greeting ── -->
    <header id="header">
      <button id="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      <div id="clock"></div>
      <div id="Current_date"></div>
      <div id="greeting"></div>
    </header>

    <!-- ── Middle row: Timer + Tasks ── -->
    <main id="main-row">

      <div id="timer-section">
        <h2>Focus Timer</h2>
        <div id="Timer_display">25:00</div>
        <div id="timer-controls">
          <button id="Start-btn">Start</button>
          <button id="Stop-btn" class="hidden">Stop</button>
          <button id="Reset-btn">Reset</button>
          <button id="Change-time-btn">⏱ Change</button>
        </div>
      </div>

      <!-- Change Time Modal -->
      <div id="time-modal-overlay" class="hidden">
        <div id="time-modal">
          <h3>Set Pomodoro Time</h3>
          <label for="custom-minutes">Minutes:</label>
          <input type="number" id="custom-minutes" min="1" max="120" placeholder="25" />
          <div id="time-modal-actions">
            <button id="time-modal-confirm">Set</button>
            <button id="time-modal-cancel">Cancel</button>
          </div>
        </div>
      </div>

      <div id="task-section">
        <h2>Task List</h2>
        <div id="task-input-row">
          <input type="text" id="task-input" placeholder="Enter a new task..." />
          <button id="add-task-btn">Add Task</button>
        </div>
        <ul id="task-list"></ul>
      </div>

    </main>

    <!-- ── Bottom: Quick Links ── -->
    <footer id="links-section">
      <h2>Quick Links</h2>
      <div id="link-input-row">
        <input type="text" id="link-name-input" placeholder="Name (e.g. YouTube)" />
        <input type="url"  id="link-url-input"  placeholder="URL (e.g. https://youtube.com)" />
        <button id="add-link-btn">Add</button>
      </div>
      <div id="link-list"></div>
    </footer>

    <script src="js/main.js"></script>
  </body>
</html>
